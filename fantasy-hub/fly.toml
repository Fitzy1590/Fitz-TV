# Fly.io deployment: see README "Deploying".
# fly launch --no-deploy --copy-config  (pick a unique app name)
# fly volumes create hub_data --size 1 --region <your region>
# fly secrets set APP_PASSWORD=... APP_SECRET=$(openssl rand -hex 32) PUBLIC_URL=https://<app>.fly.dev
# fly deploy
app = "fitz-fantasy-hub"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  DATA_DIR = "/data"

[mounts]
  source = "hub_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Keep one machine running so lineup alerts are checked around the clock.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
