name: Build Fitz-TV APK

on:
  push:
    paths:
      - "android/**"
      - "shield/device/**"
      - "shield/packages.txt"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Publish as the "optimizer-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FitzTV-Optimizer.apk
          # Remove an older release made by this workflow under the generic "latest" tag.
          if gh release view latest --json name -q .name 2>/dev/null | grep -q "Fitz-TV Optimizer"; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release delete optimizer-latest --yes --cleanup-tag || true
          # Pre-release and never "latest", so the Fitz-TV app's own update channel is untouched.
          gh release create optimizer-latest FitzTV-Optimizer.apk --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Fitz-TV Optimizer (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Install FitzTV-Optimizer.apk on your phone or Shield."
      - uses: actions/upload-artifact@v4
        with:
          name: FitzTV-Optimizer-apk
          path: FitzTV-Optimizer.apk
