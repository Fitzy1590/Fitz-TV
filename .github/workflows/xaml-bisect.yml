name: xaml-bisect
on:
  push:
    paths: [".github/workflows/xaml-bisect.yml"]
jobs:
  v:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [base, nofn, notrans, nomica, notyped, all]
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Transform XAML (${{ matrix.variant }})
        shell: pwsh
        run: |
          $p = "src/FitzTV.Windows/MainWindow.xaml"
          $x = Get-Content $p -Raw
          $v = "${{ matrix.variant }}"
          if ($v -in "nofn","all")    { $x = $x -replace 'Visibility="\{x:Bind Vis\([^)]*\)[^"]*"','Visibility="Visible"' }
          if ($v -in "notrans","all") { $x = [regex]::Replace($x,'(?s)<ListView\.ItemContainerTransitions>.*?</ListView\.ItemContainerTransitions>','') }
          if ($v -in "nomica","all")  { $x = [regex]::Replace($x,'(?s)<Window\.SystemBackdrop>.*?</Window\.SystemBackdrop>','') }
          if ($v -in "notyped","all") { $x = $x -replace 'x:DataType="[^"]*"','' -replace '\{x:Bind (Name|Group|Title|League|Score|Status)\}','{Binding $1}' }
          Set-Content $p $x
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/FitzTV.Windows -c Release -p:Platform=x64 -v:m *> build.log
          if ($LASTEXITCODE -eq 0) { "RESULT ${{ matrix.variant }}: BUILD OK"; exit 0 }
          if (Select-String -Path build.log -Pattern "XamlCompiler.exe.*exited with code" -Quiet) { "RESULT ${{ matrix.variant }}: XAML COMPILER FAILED" }
          else { "RESULT ${{ matrix.variant }}: other error"; Select-String -Path build.log -Pattern "error " | Select-Object -First 8 | ForEach-Object { $_.Line.Trim() } }
          exit 1
