name: windows
on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet test tests/FitzTV.Tests
      - run: dotnet build src/FitzTV.Windows -c Release -p:Platform=x64
